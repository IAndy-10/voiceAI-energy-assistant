name: Tests

# Runs the pytest suite on every push to main and every pull request.
# OpenAI, ElevenLabs and Pipecat services are stubbed, so no tokens or
# credits are consumed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            voice_agent/requirements-voice.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r voice_agent/requirements-voice.txt

      - name: Compile check
        run: python -m compileall -q energy_tools voice_agent

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
