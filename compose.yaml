services:
  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "127.0.0.1:8766:80"
    restart: unless-stopped

  energy-api:
    build:
      context: .
      target: energy-api
    environment:
      ENERGY_TOOLS_API_TOKEN: ${ENERGY_TOOLS_API_TOKEN:?Set ENERGY_TOOLS_API_TOKEN in your shell or .env file}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_BUDGET_USD: ${OPENAI_BUDGET_USD:-2.00}
      OPENAI_MAX_QUERIES: ${OPENAI_MAX_QUERIES:-20}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-300}
      OPENAI_MAX_INPUT_TOKENS: ${OPENAI_MAX_INPUT_TOKENS:-4000}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      OPENAI_MAX_TOOL_ROUNDS: ${OPENAI_MAX_TOOL_ROUNDS:-2}
      OPENAI_MAX_TOOL_CALLS: ${OPENAI_MAX_TOOL_CALLS:-6}
      OPENAI_RESERVE_USD: ${OPENAI_RESERVE_USD:-0.10}
      OPENAI_INPUT_USD_PER_MILLION: ${OPENAI_INPUT_USD_PER_MILLION:-0.10}
      OPENAI_OUTPUT_USD_PER_MILLION: ${OPENAI_OUTPUT_USD_PER_MILLION:-0.50}
      OPENAI_USAGE_FILE: /var/lib/vesta-agent/usage.json
      VESTA_DEMO_SNAPSHOT_SHA256: ${VESTA_DEMO_SNAPSHOT_SHA256:-4fb95b36721ba61d7f8221b2b686b9a8ea731267078025059eba78433aa06882}
      SNAPSHOT_MAX_BYTES: ${SNAPSHOT_MAX_BYTES:-5242880}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    volumes:
      - agent-usage:/var/lib/vesta-agent

volumes:
  agent-usage:
