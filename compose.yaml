services:
  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "127.0.0.1:8766:80"
    restart: unless-stopped

  energy-api:
    build:
      context: .
      target: energy-api
    environment:
      ENERGY_TOOLS_API_TOKEN: ${ENERGY_TOOLS_API_TOKEN:?Set ENERGY_TOOLS_API_TOKEN in your shell or .env file}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_BUDGET_USD: ${OPENAI_BUDGET_USD:-2.00}
      OPENAI_MAX_QUERIES: ${OPENAI_MAX_QUERIES:-20}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-300}
      OPENAI_MAX_INPUT_TOKENS: ${OPENAI_MAX_INPUT_TOKENS:-4000}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      OPENAI_MAX_TOOL_ROUNDS: ${OPENAI_MAX_TOOL_ROUNDS:-2}
      OPENAI_MAX_TOOL_CALLS: ${OPENAI_MAX_TOOL_CALLS:-6}
      OPENAI_RESERVE_USD: ${OPENAI_RESERVE_USD:-0.10}
      OPENAI_INPUT_USD_PER_MILLION: ${OPENAI_INPUT_USD_PER_MILLION:-0.10}
      OPENAI_OUTPUT_USD_PER_MILLION: ${OPENAI_OUTPUT_USD_PER_MILLION:-0.50}
      OPENAI_USAGE_FILE: /var/lib/vesta-agent/usage.json
      VESTA_DEMO_SNAPSHOT_SHA256: ${VESTA_DEMO_SNAPSHOT_SHA256:-4fb95b36721ba61d7f8221b2b686b9a8ea731267078025059eba78433aa06882}
      SNAPSHOT_MAX_BYTES: ${SNAPSHOT_MAX_BYTES:-5242880}
      VOICE_ENABLED: ${VOICE_ENABLED:-true}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-pipecat}
      VOICE_PIPECAT_URL: ${VOICE_PIPECAT_URL:-http://127.0.0.1:7860}
      # Browser URL and container-side health URL can differ for a Windows runner.
      VOICE_RUNNER_HEALTH_URL: ${VOICE_RUNNER_HEALTH_URL:-http://voice-agent:7860}
      VOICE_PIPELINE_ENABLED: ${VOICE_PIPELINE_ENABLED:-false}
      VOICE_MAX_SESSION_SECONDS: ${VOICE_SESSION_MAX_SECONDS:-300}
      VOICE_MAX_RECORDING_SECONDS: ${VOICE_MAX_RECORDING_SECONDS:-30}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    volumes:
      - agent-usage:/var/lib/vesta-agent

  # Docker Desktop on macOS cannot route browser media to a container address,
  # so the browser relays through this TURN server (see docs/plan.md, Parte 2).
  # Only port 3478 is published; the relay ports stay on the Compose network,
  # where the bot reaches them directly.
  turn-local:
    image: coturn/coturn:4.6.3-r3-alpine
    command: ["-n", "--listening-port=3478", "--min-port=49160", "--max-port=49169", "--realm=vesta.local",
              "--use-auth-secret", "--static-auth-secret=${TURN_SHARED_SECRET:-}", "--fingerprint",
              "--no-tls", "--no-dtls", "--no-cli", "--no-multicast-peers", "--log-file=stdout", "--simple-log"]
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
    restart: unless-stopped

  voice-agent:
    image: vesta-pipecat-voice-agent:0.4.2
    build:
      context: .
      dockerfile: voice_agent/Dockerfile
    command: ["python", "-m", "voice_agent.webrtc_turn_runner", "-t", "webrtc", "--host", "0.0.0.0", "--port", "7860",
              "--allowed-origins", "http://127.0.0.1:8000", "http://localhost:8000"]
    environment:
      VOICE_AGENT_ENABLED: ${VOICE_AGENT_ENABLED:-false}
      VOICE_ENERGY_API_BASE_URL: http://energy-api:8000
      VOICE_ENERGY_API_TOKEN: ${ENERGY_TOOLS_API_TOKEN:?Set ENERGY_TOOLS_API_TOKEN in your shell or .env file}
      # The audio pipeline has its own opt-in; enabling text AI must not start it.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOICE_PIPELINE_ENABLED: ${VOICE_PIPELINE_ENABLED:-false}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      # aiortc uses the first host (Compose network); the browser uses 127.0.0.1.
      PIPECAT_TURN_HOST: turn-local,127.0.0.1
      VOICE_TURN_TTL_SECONDS: ${VOICE_TURN_TTL_SECONDS:-86400}
      VOICE_SESSION_MAX_SECONDS: ${VOICE_SESSION_MAX_SECONDS:-300}
      VOICE_IDLE_TIMEOUT_SECONDS: ${VOICE_IDLE_TIMEOUT_SECONDS:-45}
      VOICE_STT_MODEL: ${VOICE_STT_MODEL:-gpt-transcribe}
      VOICE_LLM_MODEL: ${VOICE_LLM_MODEL:-${OPENAI_MODEL:-gpt-6-luna}}
      VOICE_LLM_MAX_TOKENS: ${VOICE_LLM_MAX_TOKENS:-300}
      VOICE_TTS_MODEL: ${VOICE_TTS_MODEL:-gpt-4o-mini-tts}
      VOICE_TTS_VOICE: ${VOICE_TTS_VOICE:-alloy}
      VOICE_MAX_TURNS: ${VOICE_MAX_TURNS:-8}
      VOICE_TOOL_TIMEOUT_SECONDS: ${VOICE_TOOL_TIMEOUT_SECONDS:-10}
      VOICE_SESSION_BUDGET_USD: ${VOICE_SESSION_BUDGET_USD:-0.20}
      VOICE_BUDGET_USD: ${VOICE_BUDGET_USD:-2.00}
      VOICE_MAX_SESSIONS: ${VOICE_MAX_SESSIONS:-10}
      VOICE_USAGE_FILE: /var/lib/vesta-voice/usage.json
    depends_on:
      - energy-api
      - turn-local
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - voice-usage:/var/lib/vesta-voice
    restart: unless-stopped
    healthcheck:
      # Runner reachability only; an HTTP response does not prove ICE/media.
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:7860/client/', timeout=2).read(1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  agent-usage:
  voice-usage:
