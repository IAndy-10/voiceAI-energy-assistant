server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index dashboard.html;

    location = / {
        try_files /dashboard.html =404;
    }

    location = /dashboard.html {
        add_header Cache-Control "no-store" always;
        try_files /dashboard.html =404;
    }
}
