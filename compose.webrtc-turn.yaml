# Opt-in Docker Desktop experiment: coturn relays media; compose.yaml is unchanged.
services:
  turn-local:
    image: coturn/coturn:4.6.3-r3-alpine
    profiles: ["webrtc-turn"]
    env_file:
      - .env.turn.local
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./voice_agent/turnserver.local.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:49160-49169:49160-49169/udp"

  voice-agent-webrtc-turn:
    image: vesta-pipecat-voice-agent:0.4.2
    profiles: ["webrtc-turn"]
    env_file:
      - .env.turn.local
    environment:
      PIPECAT_TURN_HOST: host.docker.internal
      VOICE_TURN_TTL_SECONDS: "600"
    command: ["python", "-m", "voice_agent.webrtc_turn_runner", "-t", "webrtc", "--host", "0.0.0.0", "--port", "7862", "--allowed-origins", "http://127.0.0.1:7862"]
    depends_on:
      - turn-local
    ports:
      - "127.0.0.1:7862:7862/tcp"
